# Cloudflare Workers 配置（部署按钮 deploy.workers.cloudflare.com 使用）
# 功能等价于 Pages：静态资源托管 + Pages Functions（functions/ 目录）
# 部署后域名仍为 *.pages.dev
name = "squoosh-image"
compatibility_date = "2024-09-23"

# 静态资源目录：npm run build 的输出目录
[assets]
directory = "build"

# 环境变量。ALLOWED_URL_HOSTS 留空=不限制 ?url= 抓取；
# 设了值则只允许这些域名（逗号分隔，如 "cdn.example.com,images.example.com"）。
# 部署按钮会自动读取 [vars] 并预填到表单中。
[vars]
ALLOWED_URL_HOSTS = "cdn.sanity.io"
