# Cloudflare Pages 配置（部署按钮 deploy.workers.cloudflare.com 使用）
# 部署按钮的解析器支持 pages_build_output_dir，不支持 [assets] 语法
# 因此这里用 Pages 格式：输出目录由 pages_build_output_dir 指定
name = "squoosh-image"
pages_build_output_dir = "build"
compatibility_date = "2024-09-23"

# 环境变量。ALLOWED_URL_HOSTS 留空=不限制 ?url= 抓取；
# 设了值则只允许这些域名（逗号分隔，如 "cdn.example.com,images.example.com"）。
# 部署按钮会自动读取 [vars] 并预填到表单中。
[vars]
ALLOWED_URL_HOSTS = "cdn.sanity.io"
