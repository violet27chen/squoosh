# Cloudflare Pages 配置（手动 wrangler pages deploy 使用）
# 注意：Cloudflare 已废弃旧版 Pages 一键部署按钮，现仅提供 Worker 版按钮
# （与本 Pages Functions 项目不兼容），因此走手动部署或控制台连接 Git。
# 部署读取 pages_build_output_dir 作为构建产物目录（不支持 [assets] 语法）。
name = "edgeimg"
pages_build_output_dir = "build"
compatibility_date = "2024-09-23"

# 环境变量。ALLOWED_URL_HOSTS 留空=不限制 ?url= 抓取；
# 设了值则只允许这些域名（逗号分隔，如 "cdn.example.com,images.example.com"）。
# 部署按钮会自动读取 [vars] 并预填到表单中。
[vars]
ALLOWED_URL_HOSTS = "cdn.sanity.io"
